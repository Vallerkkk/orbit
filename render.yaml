services:
  - type: web
    name: orbita-app
    runtime: python
    plan: free
    # Push na branch publicada dispara o deploy; o Render espera /healthz responder antes de trocar o tráfego.
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
