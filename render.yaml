services:
  - type: web
    name: orbita-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_PRODUCTION
        value: "false"
