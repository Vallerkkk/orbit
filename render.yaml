services:
  - type: web
    name: orbita-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: FLATKEY_API_KEY
        sync: false
      - key: FLATKEY_MODEL
        value: MiniMax-H3
      - key: STT_API_KEY
        sync: false
      - key: STT_MODEL
        value: whisper-large-v3-turbo

  # Ponte de voz Discord <-> Órbita (discord_bridge/). O plano free do Render
  # não mantém workers ligados 24h; é preciso um plano pago (ex.: starter)
  # para o bot ficar sempre conectado no Discord. Veja discord_bridge/README.md.
  - type: worker
    name: orbita-discord-bridge
    runtime: python
    plan: starter
    buildCommand: pip install -r discord_bridge/requirements.txt
    startCommand: python -m discord_bridge.bot
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
